spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /auth/$\{segment}
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: vehicle-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - RewritePath=/api/v1/vehicles/(?<segment>.*), /vehicles/$\{segment}
            - name: CircuitBreaker
              args:
                name: vehicleServiceCircuitBreaker
                fallbackUri: forward:/fallback/vehicle-service

        - id: rental-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/rentals/**
          filters:
            - RewritePath=/api/v1/rentals/(?<segment>.*), /rentals/$\{segment}
            - name: CircuitBreaker
              args:
                name: rentalServiceCircuitBreaker
                fallbackUri: forward:/fallback/rental-service

        - id: location-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/locations/**
          filters:
            - RewritePath=/api/v1/locations/(?<segment>.*), /locations/$\{segment}
            - name: CircuitBreaker
              args:
                name: locationServiceCircuitBreaker
                fallbackUri: forward:/fallback/location-service

        - id: battery-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/battery/**
          filters:
            - RewritePath=/api/v1/battery/(?<segment>.*), /battery/$\{segment}
            - name: CircuitBreaker
              args:
                name: batteryServiceCircuitBreaker
                fallbackUri: forward:/fallback/battery-service

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
            methods: GET,POST
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

server:
  port: ${API_GATEWAY_PORT:8080}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      vehicleServiceCircuitBreaker:
        baseConfig: default
      rentalServiceCircuitBreaker:
        baseConfig: default
      locationServiceCircuitBreaker:
        baseConfig: default
      batteryServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
