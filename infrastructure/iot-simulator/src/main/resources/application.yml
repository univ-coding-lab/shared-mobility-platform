spring:
  application:
    name: iot-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${IOT_SIMULATOR_PORT:8086}

simulator:
  vehicle:
    count: ${SIMULATOR_VEHICLE_COUNT:10}
  update:
    interval: ${SIMULATOR_UPDATE_INTERVAL:10000}
  moving:
    probability: ${SIMULATOR_MOVING_PROBABILITY:0.3}
  http:
    enabled: ${SIMULATOR_HTTP_ENABLED:true}

services:
  location:
    url: ${LOCATION_SERVICE_URL:http://localhost:8084}
  battery:
    url: ${BATTERY_SERVICE_URL:http://localhost:8085}

logging:
  level:
    root: INFO
    com.next.iotsimulator: INFO
    com.next.common.event: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
